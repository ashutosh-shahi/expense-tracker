<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="top-bar">

            <h1>💰 Expense Tracker</h1>

            <button id="themeBtn">🌙</button>

        </div>

        <!-- Add Expense Form -->

        <div class="form-row">

            <select id="category">

                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Education</option>
                <option>Miscellaneous</option>

            </select>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense Name"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
            >

            <button id="addBtn">
                Add Expense
            </button>

        </div>

        <!-- Stats Cards -->

        <div class="stats">

            <div class="card">

                <h2 id="total">
                    ₹0
                </h2>

                <p>Total Expenses</p>

            </div>

            <div class="card">

                <h2 id="count">
                    0
                </h2>

                <p>Total Transactions</p>

            </div>

        </div>

        <!-- Search + Filter -->

        <div class="filter-row">

            <input
                type="text"
                id="search"
                placeholder="Search expenses..."
            >

            <select id="filterCategory">

                <option>All</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Education</option>
                <option>Miscellaneous</option>

            </select>

        </div>

        <!-- Expense List -->

        <h2 class="expense-heading">
            Expenses
        </h2>

        <ul id="expenseList">

        </ul>

        <!-- Footer Buttons -->

        <div class="bottom-actions">

            <button id="clearBtn">
                Clear All
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
